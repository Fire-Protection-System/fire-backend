spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${BACKEND_PORT}
spring.profiles.active=${SPRING_PROFILE}
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.mvc.cors.allowed-methods=${CORS_ALLOWED_METHODS}
spring.mvc.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
spring.mvc.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.pl.edu.agh.kis.firebackend=${LOG_LEVEL_APP}
logging.file.name=${LOG_FILE_NAME}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%level] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%level] %logger{36} - %msg%n